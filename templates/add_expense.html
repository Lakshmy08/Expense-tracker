{% extends 'base.html' %}

{% block content %}


<div class="container mt-5">
    <div class="text-center mb-4">
        <h1>Expense Tracker</h1>
        <p class="lead">Add a new expense</p>
    </div>

    <div class="card p-4 shadow" style="max-width: 600px; margin: 0 auto;">
        <h4 class="text-center mb-4">Add Expense</h4>
       <form method="POST">
    <div class="mb-3">
        <label for="amount" class="form-label">Amount (₹)</label>
        <input type="number" step="0.01" name="amount" class="form-control" id="amount" required>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <input type="text" name="description" class="form-control" id="description" required>
    </div>
    <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" name="date" class="form-control" id="date" required>
    </div>
    <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select name="category" class="form-select" id="category" required>
            <option value="">--Select Category--</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="currency" class="form-label">Currency</label>
        <select name="currency" class="form-select" id="currency" required>
            <option value="INR">₹ INR</option>
            <option value="USD">$ USD</option>
            <option value="EUR">€ EUR</option>
            <option value="GBP">£ GBP</option>
        </select>
    </div>
    <button type="submit" class="btn btn-success w-100">Add Expense</button>
    <a href="{{ url_for('home') }}" class="btn btn-secondary w-100 mt-3">Back</a>
</form>

    </div>
</div>
{% endblock %}
