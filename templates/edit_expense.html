{% extends 'base.html' %}

{% block content %}
<!-- Navbar -->


<div class="container mt-5">
    <div class="text-center mb-4">
        <h1>Expense Tracker</h1>
        <p class="lead">Edit Expense</p>
    </div>

    <div class="card p-4 shadow" style="max-width: 600px; margin: 0 auto;">
        <h4 class="text-center mb-4">Edit Expense</h4>
        <form method="POST">
            <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" name="description" class="form-control" value="{{ expense.description }}" required>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" name="date" class="form-control" value="{{ expense.date }}" required>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option value="Food" {% if expense.category == "Food" %}selected{% endif %}>Food</option>
                    <option value="Travel" {% if expense.category == "Travel" %}selected{% endif %}>Travel</option>
                    <option value="Bills" {% if expense.category == "Bills" %}selected{% endif %}>Bills</option>
                    <option value="Shopping" {% if expense.category == "Shopping" %}selected{% endif %}>Shopping</option>
                    <option value="Other" {% if expense.category == "Other" %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="currency" class="form-label">Currency</label>
                <select name="currency" class="form-select" required>
                    <option value="INR" {% if expense.currency == "INR" %}selected{% endif %}>₹ INR</option>
                    <option value="USD" {% if expense.currency == "USD" %}selected{% endif %}>$ USD</option>
                    <option value="EUR" {% if expense.currency == "EUR" %}selected{% endif %}>€ EUR</option>
                    <option value="GBP" {% if expense.currency == "GBP" %}selected{% endif %}>£ GBP</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Update Expense</button>
        </form>        
    </div>
</div>
{% endblock %}
